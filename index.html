<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ระบบแผนที่ เมืองทองธานี (MTT) - Smart Panel Flow</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    <script src="https://unpkg.com/leaflet-polylinedecorator/dist/leaflet.polylineDecorator.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Sarabun', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100vw; }

        /* 📍 กล่องอธิบายสัญลักษณ์ (ขวาล่าง) */
        .legend-box {
            background: white; padding: 10px 15px; border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); line-height: 1.5rem;
            color: #333; font-size: 14px;
        }
        .legend-box h4 { margin: 0 0 10px 0; font-size: 16px; text-align: center; }
        .color-box {
            display: inline-block; width: 20px; height: 10px;
            margin-right: 8px; border: 1px solid #999;
        }

        /* 📍 กล่องข้อมูลแทน Popup (ขวาบน) */
        .info-panel-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 5px;
            pointer-events: none; 
        }
        .info-card {
            background: rgba(255, 255, 255, 0.95);
            border-left: 6px solid;
            padding: 12px 30px 12px 15px;
            border-radius: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 220px;
            font-size: 13px;
            position: relative;
            pointer-events: auto; 
            animation: slideIn 0.3s ease;
        }
        .info-card h4 { margin: 0 0 5px 0; font-size: 15px; color: #222; }
        .info-card p { margin: 0; color: #555; line-height: 1.4; }
        .close-btn {
            position: absolute;
            top: 8px;
            right: 10px;
            cursor: pointer;
            color: #999;
            font-size: 16px;
            line-height: 1;
            padding: 5px;
        }
        .close-btn:hover { color: #d9534f; }
        
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        
        /* 📍 อนิเมชันเส้นกระพริบ/วิ่ง */
        .flow-line-anim {
            animation: flow-animation 1s linear infinite !important;
        }
        @keyframes flow-animation {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }

        @media (max-width: 600px) {
            .legend-box { font-size: 12px; padding: 8px 10px; }
            .legend-box h4 { font-size: 14px; margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

            zoom: 14,
            maxBoundsViscosity: 1.0,

            "C12-P1": { name: "ระบบระบายน้ำซอย C12  ", color: "#FFFF00", info: "สถานะ: ท่อระบายน้ำ", reverse: true },
            "bs - pump 2": { name: "ระบบระบายน้ำ ไปยัง สถานีสูบ 2 ", color: "#FFFF00", info: "สถานะ: ท่อระบายน้ำ" },

            "Lake - IF": { name: "ระบบระบายน้ำทะเลสาบผ่าน The Laken", color: "#FFFF00", info: "สถานะ: ท่อระบายน้ำ" },
            "Lake - IF2": { name: "ระบบระบายน้ำทะเลสาบผ่าน The Laken", color: "#FFFF00", info: "สถานะ: ท่อระบายน้ำ" },
            "Lake - IF3": { name: "ระบบระบายน้ำทะเลสาบผ่าน The Laken", color: "#FFFF00", info: "สถานะ: ท่อระบายน้ำ" },
            "BS- Tiwanon 2": { name: "ระบบระบายน้ำ ไปยัง ถนนติวานนท์", color: "#FFFF00", info: "สถานะ: ท่อระบายน้ำ" },
            "PS Wat Koa": { name: "สถานีสูบน้ำคลองบางพูด วัดเกาะพญาเจ๋ง 1", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "PS Parkkret 13": { name: "สถานีสูบคลองบางพูด ปากเกร็ด 13", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "PS Klong Suai": { name: "สถานีสูบคลองบางพูด เชื่อมคลองส่วย", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "PS4": { name: "สถานีสูบน้ำ 4", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "PS Klong - banmai": { name: "สถานีสูบน้ำคลองส่วย - คลองบ้านใหม่", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "PS Wat Saluk": { name: "สถานีสูบน้ำวัดสลักเหนือ", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "PS Bangplung": { name: "สถานีสูบน้ำปากคลองบางพัง", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "MP - BS": { name: "เครื่องสูบน้ำ Mobile ติวานนท์", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "MP-BS": { name: "เครื่องสูบน้ำ Mobile ติวานนท์", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "C12-1": { name: "สถานีสูบน้ำ C12-No.1", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "C12-2": { name: "สถานีสูบน้ำ C12-No.2", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "PS2": { name: "สถานีสูบน้ำ 2", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "PS3": { name: "สถานีสูบน้ำ 3", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "PS5": { name: "สถานีสูบน้ำ 5", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "PS9": { name: "สถานีสูบน้ำ 9", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "PS 10": { name: "สถานีสูบน้ำ 10", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "MST1": { name: "สถานีสูบน้ำ มสธ1", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "MST2": { name: "สถานีสูบน้ำ มสธ2", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "MST-7": { name: "สถานีสูบน้ำ มสธ7", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon },
            "MST-8": { name: "สถานีสูบน้ำ มสธ8", info: "จำนวนเครื่องสูบน้ำ .... อัตราการระบายสูงสุด.....", customIcon: pumpIcon }
        };

        // ==========================================
        // สร้างกล่องสัญลักษณ์ และกล่อง Panel ขวาบน
        // ==========================================
        var infoControl = L.control({ position: 'topright' });
        infoControl.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'info-panel-container');
            div.id = 'info-panel';
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        infoControl.addTo(map);

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend-box');
            div.innerHTML = `
                <h4>สัญลักษณ์</h4>
                <div><span class="color-box" style="background: #00FFFF;"></span> คลอง / ลำราง</div>
                <div><span class="color-box" style="background: #0000FF;"></span> ท่อระบายน้ำหลัก</div>
                <div><span class="color-box" style="background: #FFFF00;"></span> ระบบระบายน้ำภายใน</div>
                <div><img src="pump.png" style="width:16px; vertical-align:middle; margin-right:6px;"> สถานีสูบน้ำ</div>
            `;
            return div;
        };
        legend.addTo(map);

        // ==========================================
        // ระบบจำลำดับเส้น และ การวาดเส้นชี้เป้า
        // ==========================================
        var activeSequence = []; 
        var ignoreMapClick = false; // 📍 ตัวบล็อกบั๊กการคลิกทะลุแผนที่

        function updateFlowSequence() {
            activeSequence.forEach(function(item, index) {
                if (item.layer.flowTimeout) clearTimeout(item.layer.flowTimeout);
                
                // สั่งให้เส้นกระพริบเรียงลำดับ
                item.layer.flowTimeout = setTimeout(function() {
                    if (item.layer.setStyle) {
                        item.layer.setStyle({ weight: 6, color: '#FF3333', dashArray: '12, 12' }); 
                    }
                    if (item.layer.getElement && item.layer.getElement()) {
                        item.layer.getElement().classList.add('flow-line-anim'); 
                    }
                }, index * 800); 
            });
        }

        function updatePointers() {
            var mapContainer = map.getContainer();
            var mapRect = mapContainer.getBoundingClientRect();

            activeSequence.forEach(function(item) {
                if (!item.card || !item.pointerLine) return;
                
                var cardRect = item.card.getBoundingClientRect();
                var x = cardRect.left - mapRect.left - 5; 
                var y = (cardRect.top + cardRect.bottom) / 2 - mapRect.top;
                
                var cardLatLng = map.containerPointToLatLng(L.point(x, y));
                
                item.pointerLine.setLatLngs([cardLatLng, item.targetLatLng]);
                item.pointerDeco.setPaths(item.pointerLine);
            });
        }

        map.on('move zoom', updatePointers);

        window.removeFlowItem = function(id) {
            var index = activeSequence.findIndex(function(item) { return item.id === id; });
            if (index > -1) {
                var item = activeSequence[index];
                
                item.card.remove(); 
                map.removeLayer(item.pointerLine); 
                map.removeLayer(item.pointerDeco); 
                
                if (item.layer.flowTimeout) clearTimeout(item.layer.flowTimeout);
                
                // ถอนการกระพริบ กลับเป็นเส้นปกติ
                if (item.layer.setStyle) {
                    item.layer.setStyle({ weight: 4, color: item.color, dashArray: null });
                }
                if (item.layer.getElement && item.layer.getElement()) {
                    item.layer.getElement().classList.remove('flow-line-anim');
                }
                
                activeSequence.splice(index, 1);
                updateFlowSequence();
                setTimeout(updatePointers, 50); 
            }
        };

        // คลิกล้างหน้าจอทั้งหมด 
        map.on('click', function() {
            if (ignoreMapClick) return; // 📍 ถ้ากำลังคลิกเส้นอยู่ ห้ามล้างแผนที่เด็ดขาด!
            
            var currentActive = activeSequence.slice(); 
            currentActive.forEach(function(item) {
                window.removeFlowItem(item.id);
            });
        });

        // ==========================================
        // โหลดข้อมูล KML และผูกการคลิกเข้ากับหน้าจอ
        // ==========================================
        var kmlLayer = omnivore.kml('MTT.kml').addTo(map);

        kmlLayer.on('ready', function() {
            var kmlBounds = kmlLayer.getBounds();
            map.fitBounds(kmlBounds, { padding: [20, 20] });

            setTimeout(function() {
                var currentBounds = map.getBounds();
                map.setMaxBounds(currentBounds.pad(0.05)); 
                map.setMinZoom(map.getZoom());
            }, 500);

            kmlLayer.eachLayer(function(layer) {
                if (!layer.feature || !layer.feature.properties) return;
                var kmlName = layer.feature.properties.name; 

                if (layerConfig[kmlName]) {
                    var config = layerConfig[kmlName];

                    if (layer instanceof L.Marker) {
                        if (config.customIcon) layer.setIcon(config.customIcon);
                        
                        layer.on('click', function(e) {
                            ignoreMapClick = true; // บล็อกคลิกแผนที่ชั่วคราว
                            setTimeout(function(){ ignoreMapClick = false; }, 200);
                            handleLayerClick(layer, config, layer.getLatLng());
                        });
                    } else {
                        if (layer.setStyle) {
                            layer.setStyle({ color: config.color, weight: 5, opacity: 0.9 });
                            
                            if (layer instanceof L.Polyline && !(layer instanceof L.Polygon)) {
                                if (config.reverse) {
                                    var latlngs = layer.getLatLngs();
                                    if (latlngs.length > 0 && Array.isArray(latlngs[0])) {
                                        layer.setLatLngs(latlngs.map(function(arr) { return arr.slice().reverse(); }));
                                    } else {
                                        layer.setLatLngs(latlngs.slice().reverse());
                                    }
                                }

                                L.polylineDecorator(layer, {
                                    patterns: [{
                                        offset: 25, repeat: 80, 
                                        symbol: L.Symbol.arrowHead({
                                            pixelSize: 12, polygon: true, 
                                            // 📍 สำคัญมาก: ไม่ให้ลูกศรมาบังการคลิก
                                            pathOptions: { stroke: true, weight: 1, color: config.color, fillOpacity: 1, interactive: false } 
                                        })
                                    }]
                                }).addTo(map);

                                // 📍 ตอนคลิกที่เส้นคลอง/ท่อ
                                layer.on('click', function(e) {
                                    ignoreMapClick = true; // บล็อกคลิกแผนที่ชั่วคราว ไม่ให้มันปิดกล่องเราทิ้ง
                                    setTimeout(function(){ ignoreMapClick = false; }, 200);
                                    handleLayerClick(layer, config, e.latlng);
                                });
                            }
                        }
                    }
                } else {
                    if (layer.setStyle && !(layer instanceof L.Marker)) {
                        layer.setStyle({ color: "gray", weight: 3 });
                    }
                }
            });
        });

        // ==========================================
        // ฟังก์ชันสร้างกล่องมุมขวาบน พร้อมชี้เลเซอร์
        // ==========================================
        function handleLayerClick(layer, config, targetLatLng) {
            var exists = activeSequence.some(function(item) { return item.layer === layer; });
            if (!exists) {
                var uniqueId = 'item_' + Math.random().toString(36).substr(2, 9);
                
                var panel = document.getElementById('info-panel');
                if (!panel) return; // กันพังถ้า UI ยังไม่พร้อม

                var card = document.createElement('div');
                card.className = 'info-card';
                card.id = uniqueId;
                card.style.borderLeftColor = config.color || '#333';
                card.innerHTML = `
                    <span class="close-btn" onclick="removeFlowItem('${uniqueId}')">✖</span>
                    <h4>${config.name}</h4>
                    <p>${config.info}</p>
                `;
                panel.appendChild(card);

                var pointerLine = L.polyline([targetLatLng, targetLatLng], {
                    color: config.color || '#666', weight: 2, dashArray: '5,5', opacity: 0.8, interactive: false
                }).addTo(map);

                var pointerDeco = L.polylineDecorator(pointerLine, {
                    patterns: [{
                        offset: '100%', repeat: 0, 
                        symbol: L.Symbol.arrowHead({
                            pixelSize: 10, polygon: true, 
                            pathOptions: { stroke: true, weight: 1, color: config.color || '#666', fillOpacity: 0.8, interactive: false }
                        })
                    }]
                }).addTo(map);

                activeSequence.push({
                    id: uniqueId,
                    layer: layer,
                    color: config.color,
                    card: card,
                    targetLatLng: targetLatLng,
                    pointerLine: pointerLine,
                    pointerDeco: pointerDeco
                });

                updateFlowSequence();
                setTimeout(updatePointers, 30); 
            }
        }

    </script>
</body>
</html>
