<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ระบบแผนที่ เมืองทองธานี (MTT)</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>
    <script src="https://unpkg.com/leaflet-polylinedecorator/dist/leaflet.polylineDecorator.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Sarabun', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100vw; }

        .legend-box {
            background: white; padding: 10px 15px; border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2); line-height: 1.5rem;
            color: #333; font-size: 14px;
        }
        .legend-box h4 { margin: 0 0 10px 0; font-size: 16px; text-align: center; }
        .color-box {
            display: inline-block; width: 20px; height: 10px;
            margin-right: 8px; border: 1px solid #999;
        }
        
        .flow-line {
            stroke-dasharray: 12, 12 !important; 
            animation: flow-animation 1s linear infinite; 
        }
        @keyframes flow-animation {
            0% { stroke-dashoffset: 24; }
            100% { stroke-dashoffset: 0; }
        }

        @media (max-width: 600px) {
            .legend-box { font-size: 12px; padding: 8px 10px; }
            .legend-box h4 { font-size: 14px; margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        var map = L.map('map', {
            center: [13.913, 100.540], 
            zoom: 14,
            maxBoundsViscosity: 1.0 
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        var pumpIcon = L.icon({
            iconUrl: 'https://cdn-icons-png.flaticon.com/512/3299/3299935.png', 
            iconSize: [30, 30], 
            iconAnchor: [15, 30], 
            popupAnchor: [0, -30] 
        });

        // ==========================================
        // 📍 โครงสร้างข้อมูล Template เปล่าๆ
        // ==========================================
        var layerConfig = {
            
            // 📌 แบบที่ 1: เส้นปกติ (มีแค่ สี และ ข้อมูล)
            "Layer 1": { name: "ชื่อเส้นที่ 1", color: "#00FFFF", info: "รายละเอียดเส้นที่ 1" },
            
            // 📌 แบบที่ 2: เส้นที่ต้องการ "กลับทิศลูกศร" (ใส่ reverse: true)
            "Layer 2": { name: "ชื่อเส้นที่ 2 (กลับทิศ)", color: "#00FFFF", info: "รายละเอียด", reverse: true },

            // 📌 แบบที่ 3: เส้นที่ต่อกันเป็นเครือข่าย (ใส่ flowGroup เดียวกัน และกำหนด flowOrder)
            // พอคลิกปุ๊บ จะวิ่งจากลำดับ 1 -> 2 -> 3 ตามลำดับ
            "Layer 3": { name: "ท่อต้นทาง", color: "#FFFF00", info: "จุดที่ 1", flowGroup: "GroupA", flowOrder: 1 },
            "Layer 4": { name: "ท่อกลางทาง", color: "#FFFF00", info: "จุดที่ 2", flowGroup: "GroupA", flowOrder: 2 },
            "Layer 5": { name: "ท่อปลายทาง", color: "#FFFF00", info: "จุดที่ 3", flowGroup: "GroupA", flowOrder: 3 },

            // ตัวอย่างกลุ่มอื่น (GroupB)
            "Layer 6": { name: "ต้นทางกลุ่ม B", color: "#0000FF", info: "จุดที่ 1", flowGroup: "GroupB", flowOrder: 1 },
            "Layer 7": { name: "ปลายทางกลุ่ม B", color: "#0000FF", info: "จุดที่ 2", flowGroup: "GroupB", flowOrder: 2 },

            // 📌 แบบที่ 4: หมุดสถานี (ใส่ customIcon)
            "Layer 8": { name: "สถานีสูบน้ำ", info: "กำลังทำงาน", customIcon: pumpIcon }
        };

        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend-box');
            div.innerHTML = `
                <h4>สัญลักษณ์</h4>
                <div><span class="color-box" style="background: #00FFFF;"></span> คลอง / ลำราง</div>
                <div><span class="color-box" style="background: #0000FF;"></span> ท่อระบายน้ำหลัก</div>
                <div><span class="color-box" style="background: #FFFF00;"></span> ระบบระบายน้ำภายใน</div>
                <div><img src="https://cdn-icons-png.flaticon.com/512/3299/3299935.png" style="width:16px; vertical-align:middle; margin-right:6px;"> สถานีสูบน้ำ</div>
            `;
            return div;
        };
        legend.addTo(map);

        var kmlLayer = omnivore.kml('MTT.kml').addTo(map);

        kmlLayer.on('ready', function() {
            var kmlBounds = kmlLayer.getBounds();
            map.fitBounds(kmlBounds, { padding: [20, 20] });

            setTimeout(function() {
                var currentBounds = map.getBounds();
                map.setMaxBounds(currentBounds.pad(0.05)); 
                map.setMinZoom(map.getZoom());
            }, 500);

            kmlLayer.eachLayer(function(layer) {
                if (!layer.feature || !layer.feature.properties) return;
                
                var kmlName = layer.feature.properties.name; 

                if (layerConfig[kmlName]) {
                    var config = layerConfig[kmlName];

                    if (layer instanceof L.Marker) {
                        if (config.customIcon) layer.setIcon(config.customIcon);
                    } else {
                        if (layer.setStyle) {
                            layer.setStyle({ color: config.color, weight: 4, opacity: 0.9 });
                            
                            if (layer instanceof L.Polyline && !(layer instanceof L.Polygon)) {
                                
                                if (config.reverse) {
                                    var latlngs = layer.getLatLngs();
                                    if (latlngs.length > 0 && Array.isArray(latlngs[0])) {
                                        layer.setLatLngs(latlngs.map(function(arr) { return arr.slice().reverse(); }));
                                    } else {
                                        layer.setLatLngs(latlngs.slice().reverse());
                                    }
                                }

                                L.polylineDecorator(layer, {
                                    patterns: [
                                        {
                                            offset: 25, repeat: 80, 
                                            symbol: L.Symbol.arrowHead({
                                                pixelSize: 12, polygon: true, 
                                                pathOptions: { stroke: true, weight: 1, color: config.color, fillOpacity: 1 }
                                            })
                                        }
                                    ]
                                }).addTo(map);

                                layer.on('popupopen', function() {
                                    if (config.flowGroup) {
                                        var groupLayers = [];
                                        kmlLayer.eachLayer(function(otherLayer) {
                                            var otherName = otherLayer.feature?.properties?.name;
                                            var otherConfig = layerConfig[otherName];
                                            if (otherConfig && otherConfig.flowGroup === config.flowGroup) {
                                                if (otherLayer.getElement && otherLayer instanceof L.Polyline) {
                                                    groupLayers.push({ 
                                                        targetLayer: otherLayer, 
                                                        order: otherConfig.flowOrder || 99 
                                                    });
                                                }
                                            }
                                        });

                                        groupLayers.sort(function(a, b) { return a.order - b.order; });

                                        groupLayers.forEach(function(item, index) {
                                            item.targetLayer.flowTimeout = setTimeout(function() {
                                                item.targetLayer.getElement().classList.add('flow-line');
                                                item.targetLayer.setStyle({ weight: 6, color: '#FF3333' });
                                            }, index * 800); 
                                        });

                                    } else {
                                        if (layer.getElement()) {
                                            layer.getElement().classList.add('flow-line');
                                            layer.setStyle({ weight: 6, color: '#FF3333' });
                                        }
                                    }
                                });

                                layer.on('popupclose', function() {
                                    if (config.flowGroup) {
                                        kmlLayer.eachLayer(function(otherLayer) {
                                            var otherName = otherLayer.feature?.properties?.name;
                                            var otherConfig = layerConfig[otherName];
                                            if (otherConfig && otherConfig.flowGroup === config.flowGroup) {
                                                if (otherLayer.getElement && otherLayer instanceof L.Polyline) {
                                                    if (otherLayer.flowTimeout) clearTimeout(otherLayer.flowTimeout);
                                                    otherLayer.getElement().classList.remove('flow-line');
                                                    otherLayer.setStyle({ weight: 4, color: otherConfig.color });
                                                }
                                            }
                                        });
                                    } else {
                                        if (layer.getElement()) {
                                            layer.getElement().classList.remove('flow-line');
                                            layer.setStyle({ weight: 4, color: config.color });
                                        }
                                    }
                                });
                            }
                        }
                    }

                    layer.bindPopup("<b>" + config.name + "</b><br><hr>" + config.info);
                } else {
                    if (layer.setStyle && !(layer instanceof L.Marker)) {
                        layer.setStyle({ color: "gray", weight: 3 });
                    }
                    layer.bindPopup("<i>ยังไม่ได้ตั้งค่า: <b>" + (kmlName || "ไม่มีชื่อ") + "</b></i>");
                }
            });
        });

    </script>
</body>
</html>
