<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ระบบแผนที่ เมืองทองธานี (MTT)</title>

    <!-- โหลด Leaflet CSS และ JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- เปลี่ยนมาใช้ Plugin สำหรับอ่านไฟล์ KML โดยตรง (Omnivore) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-omnivore/0.3.4/leaflet-omnivore.min.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Sarabun', Tahoma, sans-serif; }
        #map { height: 100vh; width: 100vw; }

        .legend-box {
            background: white;
            padding: 10px 15px;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
            line-height: 1.5rem;
            color: #333;
            font-size: 14px;
        }
        .legend-box h4 {
            margin: 0 0 10px 0;
            font-size: 16px;
            text-align: center;
        }
        .color-box {
            display: inline-block;
            width: 20px;
            height: 10px;
            margin-right: 8px;
            border: 1px solid #999;
        }
        
        @media (max-width: 600px) {
            .legend-box { font-size: 12px; padding: 8px 10px; }
            .legend-box h4 { font-size: 14px; margin-bottom: 5px; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script>
        var map = L.map('map', {
            center: [13.913, 100.540], 
            zoom: 14,
            maxBoundsViscosity: 1.0 
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // ==========================================
        // ตั้งค่าข้อมูล Layer (เชื่อมชื่อใน KML กับสี)
        // ==========================================
        var layerConfig = {
            "คลอง A": { name: "คลองสายหลัก", color: "#007bff", info: "รับน้ำจากภายนอก" },
            "คลอง B": { name: "คลองระบายน้ำ", color: "#28a745", info: "สถานะ: ปกติ" },
            "สถานี 1": { name: "สถานีสูบน้ำ", color: "#dc3545", info: "สถานะ: ปิดเครื่อง" }
        };

        // ==========================================
        // สร้างกล่อง Legend มุมขวาล่าง
        // ==========================================
        var legend = L.control({ position: 'bottomright' });
        legend.onAdd = function (map) {
            var div = L.DomUtil.create('div', 'legend-box');
            div.innerHTML = `
                <h4>สัญลักษณ์</h4>
                <div><span class="color-box" style="background: #007bff;"></span> คลองสายหลัก</div>
                <div><span class="color-box" style="background: #28a745;"></span> คลองระบายน้ำ</div>
                <div><span class="color-box" style="background: #dc3545;"></span> สถานีสูบน้ำ / จุดแจ้งเตือน</div>
                <div><span class="color-box" style="background: gray;"></span> อื่นๆ (ยังไม่ได้ระบุสี)</div>
            `;
            return div;
        };
        legend.addTo(map);

        // ==========================================
        // โหลดและจัดการไฟล์ KML
        // ==========================================
        // โหลดไฟล์ MTT.kml (ต้องมีไฟล์นี้อยู่ใน Github)
        var kmlLayer = omnivore.kml('MTT.kml').addTo(map);

        // ทำงานเมื่อ KML โหลดสำเร็จ
        kmlLayer.on('ready', function() {
            
            // ซูมหาพื้นที่และล็อคหน้าจอ
            var kmlBounds = kmlLayer.getBounds();
            map.fitBounds(kmlBounds, { padding: [30, 30] });

            setTimeout(function() {
                map.setMaxBounds(map.getBounds().pad(0.2)); 
                map.setMinZoom(map.getZoom());
            }, 500);

            // วนลูปจัดการสีและ Popup
            kmlLayer.eachLayer(function(layer) {
                if (!layer.feature || !layer.feature.properties) return;
                
                var kmlName = layer.feature.properties.name; 

                if (layerConfig[kmlName]) {
                    var config = layerConfig[kmlName];
                    if (layer.setStyle) {
                        layer.setStyle({ color: config.color, weight: 4, opacity: 0.9 });
                    }
                    layer.bindPopup("<b>" + config.name + "</b><br><hr>" + config.info);
                } else {
                    if (layer.setStyle) layer.setStyle({ color: "gray", weight: 3 });
                    layer.bindPopup("<i>ยังไม่ได้ตั้งค่า: <b>" + (kmlName || "ไม่มีชื่อ") + "</b></i>");
                }
            });
        });

    </script>
</body>
</html>
